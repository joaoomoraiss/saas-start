name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O postinstall roda `prisma generate`: sem o client gerado, nada compila.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Testes unitarios
        run: npm test

      # Sem servico de banco: a suite e2e sobe um Postgres em memoria (PGlite)
      # dentro do proprio processo de teste.
      - name: Testes e2e
        run: npm run test:e2e
